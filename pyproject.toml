[project]
name = "2026-post-project-voice-talk"
version = "0.1.0"
description = "Talk to go over the current AI voice landscape and dig into some research."
authors = [{ name = "John Gardner (Sinjhin)", email = "john@ardea.io" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "plotly>=6.7.0",
    "rich>=15.0.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "prompt-toolkit>=3.0.50",
    "sounddevice>=0.5",
    "numpy>=2.1",
    "huggingface-hub>=0.27",
]

[project.scripts]
voice = "voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]
